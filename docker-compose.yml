version: '3.8'

services:
  animallens:
    build: .
    container_name: animallens-server
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - ANIMALLENS_HOST=0.0.0.0
      - ANIMALLENS_PORT=8088
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - animallens-cache:/root/.cache/animallens
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  animallens-cache:
