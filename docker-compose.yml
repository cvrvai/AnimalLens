services:
  # AnimalLens Edge Vision & Crayfish Multi-Stage Perception Microservice
  animallens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animallens-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ANIMALLENS_PORT=8088
      - ANIMALLENS_API_KEY=${ANIMALLENS_API_KEY:-al_live_crayfish_vision_key_2026}
    ports:
      - "8088:8088"
    volumes:
      - ./models:/app/models
    networks:
      - animallens-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel for animallens (subdomain on aic-cc.space, e.g. vision.aic-cc.space)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: animallens-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - animallens-net
    depends_on:
      animallens:
        condition: service_healthy

networks:
  animallens-net:
    driver: bridge
