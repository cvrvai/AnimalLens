<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background Panel -->
  <rect width="960" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title -->
  <text x="480" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">ANIMALLENS 4-STAGE MULTIMODAL ETHOLOGY ARCHITECTURE</text>

  <!-- Left: Next.js Frontend Box -->
  <g transform="translate(30, 60)">
    <rect width="250" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#1e293b"/>
    <text x="125" y="27" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Next.js 14/15 Frontend</text>
    <text x="125" y="72" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">http://localhost:3000</text>
    <line x1="20" y1="90" x2="230" y2="90" stroke="#334155" stroke-width="1"/>
    <text x="25" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• 100% Pure TypeScript &amp; React</text>
    <text x="25" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• Drag &amp; Drop 4K Video Ingestion</text>
    <text x="25" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• Dynamic Canvas Bounding Overlays</text>
    <text x="25" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• Motion Vector &amp; Speed HUD</text>
    <text x="25" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• Live WebSocket Telemetry Feed</text>
    <text x="25" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• Canine Ethogram Timeline Table</text>
    <text x="25" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• Veterinary Welfare Health Score</text>
  </g>

  <!-- Middle Arrow Connection -->
  <g transform="translate(290, 200)">
    <path d="M 0 0 L 35 0" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="35,-6 47,0 35,6" fill="#06b6d4"/>
    <text x="20" y="-12" fill="#38bdf8" font-family="monospace" font-size="10.5" text-anchor="middle">REST / WS</text>
    <text x="20" y="20" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">JSON Stream</text>
  </g>

  <!-- Right: AnimalLens Edge Vision Server -->
  <g transform="translate(350, 60)">
    <rect width="580" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="580" height="42" rx="12" fill="#1e293b"/>
    <text x="290" y="27" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">AnimalLens Vision Microservice &amp; Perception Core (:8000)</text>

    <!-- Stage 1 & 2 Box -->
    <g transform="translate(15, 55)">
      <rect width="265" height="155" rx="8" fill="#090d16" stroke="#0284c7" stroke-width="1.2"/>
      <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">STAGE 1: Spatial Perception</text>
      <text x="12" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• YOLOv8s Multi-Animal Detection</text>
      <text x="12" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• Dynamic Resolution (640 - 1280)</text>
      <line x1="12" y1="75" x2="253" y2="75" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="95" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">STAGE 2: Multi-Object MOT</text>
      <text x="12" y="115" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• BoT-SORT 8D Kalman State Filter</text>
      <text x="12" y="133" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• Persistent Track IDs (DOG-01, 02)</text>
    </g>

    <!-- Stage 3 Box -->
    <g transform="translate(295, 55)">
      <rect width="270" height="155" rx="8" fill="#090d16" stroke="#059669" stroke-width="1.2"/>
      <text x="12" y="22" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">STAGE 3: Kinematics &amp; Ethogram</text>
      <text x="12" y="45" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• Velocity Vectors (v in m/s &amp; km/h)</text>
      <text x="12" y="67" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• Heading θ &amp; Acceleration Spikes</text>
      <text x="12" y="89" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• Inter-Individual Distance (IID) Matrix</text>
      <text x="12" y="111" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• 23 Canine Ethogram Action States</text>
      <text x="12" y="133" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• Rolling Hysteresis Majority Filter</text>
    </g>

    <!-- Stage 4 Box -->
    <g transform="translate(15, 220)">
      <rect width="550" height="95" rx="8" fill="#090d16" stroke="#9333ea" stroke-width="1.2"/>
      <text x="15" y="22" fill="#c084fc" font-family="sans-serif" font-size="11.5" font-weight="700">STAGE 4: Cognitive Reasoning &amp; Active Learning Loop (Layer B)</text>
      <text x="15" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Gated Uncertainty Triage: Routes edge anomalies (Conf &lt; 0.50) to local LLM</text>
      <text x="15" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ollama Client (Gemma 3 / Llama 3.2): Natural language veterinary diagnosis</text>
      <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• MongoDB Time-Series Collection: Auto-stores edge cases for model fine-tuning</text>
    </g>
  </g>
</svg>
