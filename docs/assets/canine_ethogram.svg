<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEtho" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="900" height="380" rx="16" fill="url(#bgEtho)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Canine Behavior Classification Ethogram (23 Behaviors)</text>

  <!-- 5 Columns -->
  <!-- 1. Locomotion -->
  <g transform="translate(30, 65)">
    <rect width="155" height="285" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="155" height="36" rx="10" fill="#0369a1"/>
    <text x="77" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Locomotion (5)</text>
    <text x="14" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">• running_gallop</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="12">• trotting</text>
    <text x="14" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12">• walking</text>
    <text x="14" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">• jumping</text>
    <text x="14" y="185" fill="#e2e8f0" font-family="sans-serif" font-size="12">• tail_wagging</text>
    <line x1="10" y1="215" x2="145" y2="215" stroke="#334155" stroke-width="1"/>
    <text x="14" y="240" fill="#38bdf8" font-family="sans-serif" font-size="10">Speed: &gt; 3.5 m/s</text>
    <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Kinematic Vector</text>
  </g>

  <!-- 2. Posture -->
  <g transform="translate(200, 65)">
    <rect width="155" height="285" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect width="155" height="36" rx="10" fill="#047857"/>
    <text x="77" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Posture (5)</text>
    <text x="14" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">• standing</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="12">• sitting</text>
    <text x="14" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12">• lying_sternal</text>
    <text x="14" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">• lying_lateral</text>
    <text x="14" y="185" fill="#e2e8f0" font-family="sans-serif" font-size="12">• sleeping</text>
    <line x1="10" y1="215" x2="145" y2="215" stroke="#334155" stroke-width="1"/>
    <text x="14" y="240" fill="#34d399" font-family="sans-serif" font-size="10">Speed: &lt; 0.3 m/s</text>
    <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Aspect Ratio 1.8+</text>
  </g>

  <!-- 3. Social Behavior -->
  <g transform="translate(370, 65)">
    <rect width="155" height="285" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect width="155" height="36" rx="10" fill="#6d28d9"/>
    <text x="77" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Social (5)</text>
    <text x="14" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">• play_bow</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="12">• sniffing_peer</text>
    <text x="14" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12">• following</text>
    <text x="14" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">• mounting</text>
    <text x="14" y="185" fill="#e2e8f0" font-family="sans-serif" font-size="12">• greeting</text>
    <line x1="10" y1="215" x2="145" y2="215" stroke="#334155" stroke-width="1"/>
    <text x="14" y="240" fill="#a78bfa" font-family="sans-serif" font-size="10">Distance: &lt; 0.6 m</text>
    <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Social Alignment</text>
  </g>

  <!-- 4. Aggression -->
  <g transform="translate(540, 65)">
    <rect width="155" height="285" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <rect width="155" height="36" rx="10" fill="#b91c1c"/>
    <text x="77" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Agonistic (4)</text>
    <text x="14" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">• aggressive_lunge</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="12">• defensive_retreat</text>
    <text x="14" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12">• growling_stance</text>
    <text x="14" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">• biting_grapple</text>
    <line x1="10" y1="215" x2="145" y2="215" stroke="#334155" stroke-width="1"/>
    <text x="14" y="240" fill="#f87171" font-family="sans-serif" font-size="10">Rapid Approach</text>
    <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">High Acceleration</text>
  </g>

  <!-- 5. Maintenance -->
  <g transform="translate(710, 65)">
    <rect width="155" height="285" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect width="155" height="36" rx="10" fill="#b45309"/>
    <text x="77" y="23" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Maintenance (4)</text>
    <text x="14" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">• eating</text>
    <text x="14" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="12">• drinking</text>
    <text x="14" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="12">• grooming_scratch</text>
    <text x="14" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">• panting</text>
    <line x1="10" y1="215" x2="145" y2="215" stroke="#334155" stroke-width="1"/>
    <text x="14" y="240" fill="#fbbf24" font-family="sans-serif" font-size="10">Head Pitch Geometry</text>
    <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Thermal Baseline</text>
  </g>
</svg>
